name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: npm ci --ignore-scripts
      - run: npm run check:format
      - name: JavaScript syntax and contracts
        run: |
          for file in static/*.js; do
            node --input-type=module --check < "$file"
          done
          node --test tests/*.test.cjs

      - name: Deterministic browser regressions
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/browsers
        run: |
          python -m playwright install --with-deps chromium
          python tests/ui_dashboard_search.py
          python tests/ui_followup.py
          python tests/ui_news_pagination.py
          python tests/ui_graph_preparation.py
          python tests/ui_graph_race.py
          python tests/ui_menu_initialization.py
          python tests/ui_architecture.py
          python tests/ui_architecture_interactions.py
