<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>뉴스 분석 시스템 · 아키텍처와 동작 흐름</title>
    <style>
      :root {
        --background: #f6f8fa;
        --foreground: #182e38;
        --border: #899aa5;
        --viz-series-1: #2563a6;
        --viz-series-2: #8463a8;
        --viz-series-3: #197969;
        --viz-series-4: #a66b17;
        --viz-series-5: #317698;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 24px;
        background: var(--background);
        color: var(--foreground);
        font:
          15px/1.6 system-ui,
          -apple-system,
          'Apple SD Gothic Neo',
          sans-serif;
      }
      main {
        max-width: 1080px;
        margin: auto;
      }
      h1 {
        margin: 0 0 20px;
        font-size: clamp(22px, 4vw, 30px);
      }
      .viz-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
        color: var(--foreground);
        font: inherit;
        cursor: pointer;
      }
      .btn[aria-pressed='true'] {
        background: var(--foreground);
        color: var(--background);
      }
      .btn:focus-visible {
        outline: 3px solid var(--viz-series-1);
        outline-offset: 3px;
      }
      .text-small {
        font-size: 14px;
      }
      @media (max-width: 540px) {
        body {
          padding: 20px 12px;
        }
        .btn {
          padding: 8px 12px;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #152028;
          --foreground: #e1ebef;
          --border: #8496a3;
          --viz-series-1: #77b1ee;
          --viz-series-2: #c0a0e4;
          --viz-series-3: #71c7b5;
          --viz-series-4: #e1b36a;
          --viz-series-5: #8ac2da;
        }
      }
    </style>
    <style>
      body {
        background:
          radial-gradient(ellipse at 5% 0%, #7468f51c, transparent 48%),
          radial-gradient(ellipse at 100% 20%, #13b9ab1a, transparent 46%), var(--background);
      }
      main {
        max-width: 1180px;
      }
      h1 {
        font-size: clamp(27px, 4vw, 44px);
        letter-spacing: -1.5px;
        margin-bottom: 8px;
      }
      .hero-kicker {
        color: var(--viz-series-3);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 3px;
        margin: 0 0 10px;
      }
      .hero-description {
        margin: 0 0 28px;
        opacity: 0.8;
      }
      .viz-controls {
        padding: 7px;
        border: 1px solid color-mix(in srgb, var(--border) 35%, transparent);
        border-radius: 16px;
        width: fit-content;
        background: color-mix(in srgb, var(--background) 80%, transparent);
      }
      .btn {
        border-color: transparent;
        border-radius: 10px;
      }
      .btn[aria-pressed='true'] {
        background: linear-gradient(120deg, #5141a0, #176e76);
        color: #fff;
        box-shadow: 0 5px 14px #5141a025;
      }
      .architecture-figure {
        padding: 18px 0;
      }
      .cycle-board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(180px, auto));
        gap: 34px;
        position: relative;
        isolation: isolate;
      }
      .cycle-step {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        text-align: left;
        padding: 20px;
        border-radius: 18px;
        border: 1px solid color-mix(in srgb, var(--tone) 35%, var(--background));
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--tone) 12%, var(--background)),
          var(--background)
        );
        box-shadow: 0 10px 28px #1020300c;
        color: var(--foreground);
        font: inherit;
        cursor: pointer;
        min-width: 0;
      }
      .cycle-step[aria-pressed='true'] {
        outline: 3px solid var(--tone);
        outline-offset: 3px;
      }
      .cycle-step:hover {
        box-shadow: 0 12px 32px color-mix(in srgb, var(--tone) 20%, transparent);
      }
      .cycle-step:focus-visible {
        outline: 3px solid var(--foreground);
        outline-offset: 4px;
      }
      .cycle-number {
        font-size: 12px;
        font-weight: 750;
        color: var(--tone);
        letter-spacing: 2px;
      }
      .cycle-step strong {
        font-size: 19px;
        margin: 8px 0;
        letter-spacing: -0.5px;
      }
      .cycle-step small {
        font-size: 13px;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }
      .cycle-time {
        margin-top: auto;
        padding-top: 12px;
        font-size: 11px;
        font-weight: 650;
        color: var(--tone);
      }
      .cycle-core {
        grid-area: 2/2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        border-radius: 50%;
        background: radial-gradient(ellipse, #7567ed20, transparent 70%);
      }
      .cycle-core b {
        font-size: clamp(20px, 2.9vw, 36px);
        letter-spacing: -2px;
        background: linear-gradient(110deg, var(--viz-series-2), var(--viz-series-3));
        background-clip: text;
        color: transparent;
      }
      .cycle-core span {
        font-size: 13px;
        margin-top: 8px;
      }
      .cycle-wires {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: visible;
        pointer-events: none;
      }
      .cycle-note {
        margin: 26px 0 0;
        border-left: 4px solid var(--viz-series-3);
        padding: 14px 18px;
        background: color-mix(in srgb, var(--viz-series-3) 7%, var(--background));
        border-radius: 0 12px 12px 0;
      }
      .cycle-note strong {
        display: block;
        margin-bottom: 6px;
      }
      [data-detail] {
        border-top: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
        padding-top: 18px;
      }
      @media (max-width: 760px) {
        .cycle-board {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
          gap: 30px;
        }
        .cycle-step {
          grid-area: auto !important;
          min-height: 150px;
        }
        .cycle-core {
          grid-area: auto;
          grid-row: 1;
          border-radius: 20px;
          padding: 16px;
        }
        .cycle-core b {
          font-size: 28px;
        }
        .cycle-core span {
          margin: 0;
        }
        .cycle-step strong {
          font-size: 19px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .cycle-step {
          transition:
            box-shadow 0.2s,
            outline-color 0.2s;
        }
      }
      @media print {
        .cycle-step {
          break-inside: avoid;
        }
        body {
          background: var(--background);
        }
      }
    </style>
    <style>
      .explore-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 18px;
        align-items: end;
        margin: 20px 0 12px;
      }
      .explore-controls label {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 13px;
        flex: 1 1 220px;
      }
      .explore-controls select {
        font: inherit;
        font-size: 16px;
        min-height: 44px;
        max-width: 100%;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--background);
        color: var(--foreground);
      }
      .playback {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .playback button {
        border: 1px solid var(--border);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #scenario-description {
        margin: 0;
        padding: 12px 16px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--viz-series-2) 9%, var(--background));
        font-size: 14px;
      }
      .cycle-board {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr);
      }
      .cycle-note {
        grid-area: 2/2;
        align-self: start;
        margin: 0;
        padding: 16px;
        min-width: 0;
        z-index: 2;
        border: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
        border-radius: 16px;
        background: var(--background);
      }
      .cycle-note h2 {
        font-size: 18px;
        line-height: 1.4;
        margin: 0 0 12px;
      }
      .io-flow {
        margin: 0;
        display: grid;
        gap: 10px;
        font-size: 13px;
      }
      .io-flow div {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 8px;
      }
      .io-flow dt {
        color: var(--viz-series-3);
        font-weight: 700;
      }
      .io-flow dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .step-condition,
      .cycle-note details {
        font-size: 12px;
        line-height: 1.6;
      }
      .cycle-note summary {
        cursor: pointer;
        min-height: 30px;
        font-weight: 600;
      }
      .cycle-note details p {
        margin: 8px 0;
      }
      .local-destination {
        color: var(--viz-series-1);
        font-size: 12px;
        display: inline-flex;
        min-height: 36px;
        align-items: center;
      }
      .local-caption {
        display: block;
        font-size: 11px;
      }
      .cycle-step {
        scroll-margin-top: 12px;
      }
      .cycle-step[data-on-route='false'] {
        background: var(--background);
        border-style: dashed;
      }
      .cycle-step[data-neighbor='true'] {
        border-color: var(--tone);
      }
      .cycle-step[data-waiting='true'] .cycle-time::after {
        content: ' · 예시: 대기';
        font-weight: 750;
      }
      [data-node] {
        cursor: pointer;
      }
      [data-node]:focus {
        outline: none;
      }
      [data-node]:focus .flow-node {
        stroke: var(--foreground) !important;
        stroke-width: 3px !important;
      }
      @media (max-width: 760px) {
        .cycle-board {
          grid-template-columns: 1fr;
        }
        .cycle-note {
          grid-area: auto;
          margin-top: -18px;
          border-color: var(--viz-series-3);
        }
        .cycle-step {
          min-height: 145px;
        }
        .cycle-note h2 {
          font-size: 17px;
        }
        .explore-controls label {
          flex-basis: 100%;
        }
        .playback {
          width: 100%;
        }
        .playback .btn {
          flex: 1;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .cycle-wires path {
          transition: stroke 0.18s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="news-architecture">
        <p class="hero-kicker">AI NEWS · SYSTEM ATLAS</p>
        <h1>뉴스가 지식이 되는 순환</h1>
        <p class="hero-description">
          계속 수집하고, 근거를 검토하고, 새로운 변화로 다시 연결합니다.
        </p>
        <div class="viz-controls" role="group" aria-label="아키텍처와 동작 흐름">
          <button class="btn" type="button" data-view="cycle" aria-pressed="true">전체 순환</button>
          <button class="btn" type="button" data-view="architecture" aria-pressed="false">
            전체 구조
          </button>
          <button class="btn" type="button" data-view="collection" aria-pressed="false">
            신규 뉴스 처리
          </button>
          <button class="btn" type="button" data-view="publication" aria-pressed="false">
            조회·공개 배포
          </button>
        </div>
        <div class="explore-controls">
          <label>가상 시나리오<select id="scenario-picker"></select></label>
          <label>탐색할 단계<select id="stage-picker"></select></label>
          <div class="playback" role="group" aria-label="설명 재생 — 실제 분석 실행 아님">
            <button class="btn" id="explain-prev" type="button">이전</button
            ><button class="btn" id="explain-play" type="button" aria-pressed="false">
              설명 재생</button
            ><button class="btn" id="explain-next" type="button">다음</button>
          </div>
        </div>
        <p id="scenario-description" aria-live="polite"></p>
        <p id="step-summary" class="text-small" aria-live="polite"></p>
        <div class="architecture-figure"></div>
        <div class="text-small" aria-live="polite" data-detail></div>
      </div>
      <style>
        #news-architecture .architecture-figure {
          margin: 16px 0;
        }
        #news-architecture .architecture-diagram {
          display: block;
          width: 100%;
          overflow: visible;
        }
        #news-architecture .architecture-diagram text {
          fill: var(--foreground);
          font-size: 12px;
        }
        #news-architecture .architecture-diagram .node-title {
          font-weight: 500;
        }
        #news-architecture .architecture-diagram .connector {
          fill: none;
          stroke: var(--border);
          stroke-width: 1.5;
        }
        #news-architecture .architecture-diagram .flow-node {
          stroke: var(--border);
          stroke-width: 1;
        }
      </style>
      <script>
        (() => {
          const root = document.getElementById('news-architecture');
          const figure = root.querySelector('.architecture-figure');
          const detail = root.querySelector('[data-detail]');
          const views = {
            cycle: { title: '정기 수집·분석 전체 순환' },
            architecture: {
              title: '수집·원장·실행·조회·공개본의 연결 구조',
              rows: [
                [
                  ['telegram', 'Telegram', '신규·수정 메시지', 1],
                  ['sources', '외부 원문', 'Agent-Reach · 출처 보강', 1],
                  ['papers', '논문 자료', '공식 초록 · 학술 색인', 1],
                ],
                [['ingestion', '입력 정리', '뉴스 중복 제거 · 논문 ID·버전', 1]],
                [
                  ['ledger', 'SQLite 원장', '원자료 · 분석 · 검토 · 실행 이력', 2],
                  ['ops', '실행 감독', 'owner · checkpoint · heartbeat', 3],
                ],
                [
                  ['projections', '증분 투영·캐시', '변경 원장 · 입력/규칙 해시', 2],
                  ['workers', '독립 분석 worker', '기본 · 논문 · 위키 · 기사', 3],
                  ['web', 'Python 웹 서버', 'API · 심층 · GraphRAG · 시뮬레이션', 3],
                ],
                [['model', '모델 실행·독립 검토', 'Codex CLI · 공유 예산 · 재시도 제한', 3]],
                [['review', '출처·검토 상태 구분', '현재 입력 · 인용 대조 · 독립 검토', 4]],
                [
                  ['local', '로컬 브라우저', '뉴스 · 지도 · 지식 · 운영', 5],
                  ['export', '공개본 생성', 'staging · 해시 조각 · manifest', 5],
                ],
                [['pages', 'GitHub Pages', '검증된 정적 자료 · 읽기 전용', 5]],
              ],
              edges: [
                ['telegram', 'ingestion'],
                ['sources', 'ingestion'],
                ['papers', 'ingestion'],
                ['ingestion', 'ledger'],
                ['ledger', 'projections'],
                ['ledger', 'workers'],
                ['ledger', 'web'],
                ['ops', 'workers'],
                ['ops', 'web'],
                ['projections', 'review'],
                ['workers', 'model'],
                ['web', 'model'],
                ['model', 'review'],
                ['review', 'local'],
                ['review', 'export'],
                ['export', 'pages'],
              ],
              detail:
                '관측 지도: 같은 문서·날짜의 공동 관측. 분석 공개: 현재 입력과 독립 검토 일치. 논문과 Telegram 뉴스는 별도 집계.',
            },
            collection: {
              title: '메시지 한 건이 변경됐을 때의 처리 흐름',
              rows: [
                [['receive', '01  신규·수정 메시지 확인', 'Telegram 수신 · 마지막 확인 시각', 1]],
                [['extract', '02  기사 추출·정규화', '메시지 → 기사 → URL/내용 중복 제거', 1]],

                [['request', '05  영속 분석 작업', '실행 대상 고정 · 입력 해시 · owner', 3]],
                [['analysis', '06  근거 분석', '기본 / 심층 / 논문 / 위키 / 기사', 3]],
                [['gate', '07  입력·인용·독립 검토', '현재 입력과 일치한 결과만 사용', 4]],
                [

                  ['pending', '검토 대기·stale', '변경 근거 확인 · 재검토 대상', 4],
                ],
              ],
              edges: [

                ['extract', 'commit'],
                ['commit', 'delta'],
                ['delta', 'request'],
                ['request', 'analysis'],
                ['analysis', 'gate'],
                ['gate', 'ready'],
                ['gate', 'pending'],
              ],
              detail:
                '신규·변경 확인과 분석 완료는 별도 상태. 사용자 pause, 제공자 cooldown, 실패·검토 이력은 각각 보존.',
            },
            publication: {
              title: '조회와 공개 배포의 분리된 실행 흐름',
              rows: [
                [['archive', '현재 원장·관측 자료', '뉴스 / 논문 / 검토 판 / 기간별 관측', 2]],
                [
                  ['api', '로컬 조회', '기능별 API · 현재 입력 검증', 3],
                  ['build', '공개 세대 생성', 'DB 읽기 스냅샷 · 자산/관측 버전 고정', 3],
                ],
                [
                  ['cache', '조회 계산 재사용', '문서 투영 · 검증 캐시 · 그래프 스냅샷', 2],
                  ['stage', 'staging 검증', '출처 정제 · ID · 해시 · 의존성', 4],
                ],
                [
                  ['browser', '로컬 화면', '탐색 · 질문 · 분석/운영 요청', 5],
                  ['switch', '정상 세대 전환', '마지막 정상본 유지 · 중단 복구', 4],

                [

                ],
                [

                  ['reader', '공개 브라우저', 'manifest → 필요한 조각만 지연 로딩', 5],
                ],
                [['retention', '이전 세대·열린 탭', '최근 24시간 보존 · 404/410 세대 복구', 2]],
              ],
              edges: [
                ['archive', 'api'],
                ['archive', 'build'],
                ['api', 'cache'],
                ['cache', 'browser'],
                ['browser', 'jobs'],
                ['jobs', 'supervision'],
                ['build', 'stage'],
                ['stage', 'switch'],
                ['switch', 'git'],
                ['git', 'reader'],
                ['reader', 'retention'],
              ],
              detail:
                '공개본에는 원문 발췌·운영 원장·인증 정보를 넣지 않음. 수집·분석 실행과 새 질문 생성은 로컬에서 수행.',
            },
          };
          let selected = 'cycle';
          const ns = 'http://www.w3.org/2000/svg';
          function element(name, attributes = {}, text = '') {
            const node = document.createElementNS(ns, name);
            for (const [key, value] of Object.entries(attributes))
              node.setAttribute(key, String(value));
            if (text) node.textContent = text;
            return node;
          }

              id: 'news-architecture-arrow',
              markerWidth: 7,
              markerHeight: 7,
              refX: 6,
              refY: 3.5,
              orient: 'auto',
              markerUnits: 'userSpaceOnUse',
            });
            marker.append(element('path', { d: 'M0 0 L7 3.5 L0 7 Z', fill: 'var(--border)' }));
            defs.append(marker);
            svg.append(defs);
            for (const [from, to] of model.edges) {
              const a = positions.get(from),
                b = positions.get(to);
              const ax = a.x + a.width / 2,
                ay = a.y + a.height,
                bx = b.x + b.width / 2,
                by = b.y;
              const middle = (ay + by) / 2;
              const rail = compact ? 5 : 1;
              const path =
                by - ay > step
                  ? `M${ax} ${ay + 2} L${ax} ${ay + 9} L${rail} ${ay + 9} L${rail} ${by - 12} L${bx} ${by - 12} L${bx} ${by - 4}`
                  : `M${ax} ${ay + 2} C${ax} ${middle} ${bx} ${middle} ${bx} ${by - 4}`;
              svg.append(
                element('path', {
                  class: 'connector',
                  style:
                    nodeSteps[selected][from] === cycleSelection ||
                    nodeSteps[selected][to] === cycleSelection
                      ? 'stroke:var(--viz-series-3);stroke-width:3px'
                      : '',
                  d: path,
                  'marker-end': 'url(#news-architecture-arrow)',
                })
              );
            }
            for (const { node, x, y, width: w, height: h } of positions.values()) {
              const index = nodeSteps[selected][node[0]];
              const group = element('g', {
                'aria-label': node[1] + ' · ' + node[2],
                'data-node': node[0],
                role: 'button',
                tabindex: 0,
                'aria-pressed': String(index === cycleSelection),
              });
              const activate = () => {
                choose(index);
                figure.querySelector(`[data-node="${node[0]}"]`)?.focus({ preventScroll: true });
              };
              group.addEventListener('click', activate);
              group.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  activate();
                }
              });
              group.append(
                element('rect', {
                  class: 'flow-node',
                  style:
                    index === cycleSelection ? 'stroke:var(--viz-series-3);stroke-width:3px' : '',
                  x,
                  y,
                  width: w,
                  height: h,
                  rx: 7,
                  fill: `color-mix(in srgb, var(--viz-series-${node[3]}) 10%, var(--background))`,
                })
              );
              group.append(
                element('rect', {
                  x: x + 1,
                  y: y + 14,
                  width: 3,
                  height: h - 28,
                  rx: 1,
                  fill: `var(--viz-series-${node[3]})`,
                })
              );
              const lines = (text, maxWidth) => {
                const probe = element('text', {}, text);
                svg.append(probe);
                const result = [];
                let line = '';
                for (const letter of text) {
                  probe.textContent = line + letter;
                  if (line && probe.getComputedTextLength() > maxWidth) {
                    result.push(line.trim());
                    line = letter;
                  } else line += letter;
                }
                if (line.trim()) result.push(line.trim());
                probe.remove();
                return result;
              };
              const titleLines = lines(node[1], w - 24);
              const subtitleLines = lines(node[2], w - 24);
              const totalHeight = (titleLines.length + subtitleLines.length) * 17 + 5;
              let baseline = y + (h - totalHeight) / 2 + 13;
              for (const line of titleLines) {
                group.append(
                  element(
                    'text',
                    { class: 'node-title', x: x + w / 2, y: baseline, 'text-anchor': 'middle' },
                    line
                  )
                );
                baseline += 17;
              }
              baseline += 5;
              for (const line of subtitleLines) {
                group.append(
                  element('text', { x: x + w / 2, y: baseline, 'text-anchor': 'middle' }, line)
                );
                baseline += 17;
              }
              svg.append(group);
            }
            detail.textContent = model.detail;
            root
              .querySelectorAll('[data-view]')
              .forEach((button) =>
                button.setAttribute('aria-pressed', String(button.dataset.view === selected))
              );
          }
          function restoreURL() {
            stopPlayback();
            const state = new URLSearchParams(location.hash.slice(1));
            selected = Object.hasOwn(views, state.get('view')) ? state.get('view') : 'cycle';
            cycleSelection = Math.max(0, stepIds.indexOf(state.get('step')));
            scenario = Object.hasOwn(scenarios, state.get('scenario'))
              ? state.get('scenario')
              : 'normal';
            draw();
          }
          root.querySelectorAll('[data-view]').forEach((button) =>
            button.addEventListener('click', () => {
              stopPlayback();
              selected = button.dataset.view;
              save();
              draw();
            })
          );
          stagePicker.addEventListener('change', () => choose(stepIds.indexOf(stagePicker.value)));
          scenarioPicker.addEventListener('change', () => {
            scenario = scenarioPicker.value;
            choose(scenarios[scenario].route[0]);
          });
          root.querySelector('#explain-prev').addEventListener('click', () => move(-1));
          root.querySelector('#explain-next').addEventListener('click', () => move(1));
          play.addEventListener('click', () => {
            if (timer) {
              stopPlayback();
              return;
            }
            const route = scenarios[scenario].route;
            if (!route.includes(cycleSelection) || cycleSelection === route.at(-1))
              choose(route[0]);
            play.textContent = '정지';
            play.setAttribute('aria-pressed', 'true');
            timer = setInterval(() => move(1, false), 2800);
          });
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopPlayback();
          });
          addEventListener('pagehide', stopPlayback);
          addEventListener('popstate', restoreURL);
          addEventListener('hashchange', restoreURL);
          let oldWidth = 0;
          new ResizeObserver(() => {
            if (selected === 'cycle') {
              placeNote();
              drawWires();
              return;
            }
            const width = figure.clientWidth;
            if (width === oldWidth) return;
            oldWidth = width;
            const focused = document.activeElement?.dataset.node;
            draw();
            if (focused)
              figure.querySelector(`[data-node="${focused}"]`)?.focus({ preventScroll: true });
          }).observe(figure);
          restoreURL();
        })();
      </script>
    </main>
  </body>
</html>
