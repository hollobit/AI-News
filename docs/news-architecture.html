<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>뉴스 분석 시스템 · 아키텍처와 동작 흐름</title>
    <style>
      :root {
        --background: #f6f8fa;
        --foreground: #182e38;
        --border: #899aa5;
        --viz-series-1: #2563a6;
        --viz-series-2: #8463a8;
        --viz-series-3: #197969;
        --viz-series-4: #a66b17;
        --viz-series-5: #317698;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 24px;
        background: var(--background);
        color: var(--foreground);
        font:
          15px/1.6 system-ui,
          -apple-system,
          'Apple SD Gothic Neo',
          sans-serif;
      }
      main {
        max-width: 1080px;
        margin: auto;
      }
      h1 {
        margin: 0 0 20px;
        font-size: clamp(22px, 4vw, 30px);
      }
      .viz-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--background);
        color: var(--foreground);
        font: inherit;
        cursor: pointer;
      }
      .btn[aria-pressed='true'] {
        background: var(--foreground);
        color: var(--background);
      }
      .btn:focus-visible {
        outline: 3px solid var(--viz-series-1);
        outline-offset: 3px;
      }
      .text-small {
        font-size: 14px;
      }
      @media (max-width: 540px) {
        body {
          padding: 20px 12px;
        }
        .btn {
          padding: 8px 12px;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #152028;
          --foreground: #e1ebef;
          --border: #8496a3;
          --viz-series-1: #77b1ee;
          --viz-series-2: #c0a0e4;
          --viz-series-3: #71c7b5;
          --viz-series-4: #e1b36a;
          --viz-series-5: #8ac2da;
        }
      }
    </style>
    <style>
      body {
        background:
          radial-gradient(ellipse at 5% 0%, #7468f51c, transparent 48%),
          radial-gradient(ellipse at 100% 20%, #13b9ab1a, transparent 46%), var(--background);
      }
      main {
        max-width: 1180px;
      }
      h1 {
        font-size: clamp(27px, 4vw, 44px);
        letter-spacing: -1.5px;
        margin-bottom: 8px;
      }
      .hero-kicker {
        color: var(--viz-series-3);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 3px;
        margin: 0 0 10px;
      }
      .hero-description {
        margin: 0 0 28px;
        opacity: 0.8;
      }
      .viz-controls {
        padding: 7px;
        border: 1px solid color-mix(in srgb, var(--border) 35%, transparent);
        border-radius: 16px;
        width: fit-content;
        background: color-mix(in srgb, var(--background) 80%, transparent);
      }
      .btn {
        border-color: transparent;
        border-radius: 10px;
      }
      .btn[aria-pressed='true'] {
        background: linear-gradient(120deg, #5141a0, #176e76);
        color: #fff;
        box-shadow: 0 5px 14px #5141a025;
      }
      .architecture-figure {
        padding: 18px 0;
      }
      .cycle-board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(180px, auto));
        gap: 34px;
        position: relative;
        isolation: isolate;
      }
      .cycle-step {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        text-align: left;
        padding: 20px;
        border-radius: 18px;
        border: 1px solid color-mix(in srgb, var(--tone) 35%, var(--background));
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--tone) 12%, var(--background)),
          var(--background)
        );
        box-shadow: 0 10px 28px #1020300c;
        color: var(--foreground);
        font: inherit;
        cursor: pointer;
        min-width: 0;
      }
      .cycle-step[aria-pressed='true'] {
        outline: 3px solid var(--tone);
        outline-offset: 3px;
      }
      .cycle-step:hover {
        box-shadow: 0 12px 32px color-mix(in srgb, var(--tone) 20%, transparent);
      }
      .cycle-step:focus-visible {
        outline: 3px solid var(--foreground);
        outline-offset: 4px;
      }
      .cycle-number {
        font-size: 12px;
        font-weight: 750;
        color: var(--tone);
        letter-spacing: 2px;
      }
      .cycle-step strong {
        font-size: 19px;
        margin: 8px 0;
        letter-spacing: -0.5px;
      }
      .cycle-step small {
        font-size: 13px;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }
      .cycle-time {
        margin-top: auto;
        padding-top: 12px;
        font-size: 11px;
        font-weight: 650;
        color: var(--tone);
      }
      .cycle-core {
        grid-area: 2/2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        border-radius: 50%;
        background: radial-gradient(ellipse, #7567ed20, transparent 70%);
      }
      .cycle-core b {
        font-size: clamp(20px, 2.9vw, 36px);
        letter-spacing: -2px;
        background: linear-gradient(110deg, var(--viz-series-2), var(--viz-series-3));
        background-clip: text;
        color: transparent;
      }
      .cycle-core span {
        font-size: 13px;
        margin-top: 8px;
      }
      .cycle-wires {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: visible;
        pointer-events: none;
      }
      .cycle-note {
        margin: 26px 0 0;
        border-left: 4px solid var(--viz-series-3);
        padding: 14px 18px;
        background: color-mix(in srgb, var(--viz-series-3) 7%, var(--background));
        border-radius: 0 12px 12px 0;
      }
      .cycle-note strong {
        display: block;
        margin-bottom: 6px;
      }
      [data-detail] {
        border-top: 1px solid color-mix(in srgb, var(--border) 40%, transparent);
        padding-top: 18px;
      }
      @media (max-width: 760px) {
        .cycle-board {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
          gap: 30px;
        }
        .cycle-step {
          grid-area: auto !important;
          min-height: 150px;
        }
        .cycle-core {
          grid-area: auto;
          grid-row: 1;
          border-radius: 20px;
          padding: 16px;
        }
        .cycle-core b {
          font-size: 28px;
        }
        .cycle-core span {
          margin: 0;
        }
        .cycle-step strong {
          font-size: 19px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .cycle-step {
          transition:
            box-shadow 0.2s,
            outline-color 0.2s;
        }
      }
      @media print {
        .cycle-step {
          break-inside: avoid;
        }
        body {
          background: var(--background);
        }
      }
    </style>
  </head>
  <body>

        <div class="architecture-figure"></div>
        <div class="text-small" aria-live="polite" data-detail></div>
      </div>

              '상태 점검 5분 · 감독은 별도',
              2,
              '운영 점검과 감독은 수집·분석 옆에서 병행됩니다. 복구 가능한 오류만 제한된 예산으로 재시도하고 사용자 일시중지는 자동 해제하지 않습니다. 다음 메시지 수신으로 순환이 이어집니다.',
            ],
          ];
          let cycleSelection = 0;
          function drawCycle() {
            const board = document.createElement('div');
            board.className = 'cycle-board';
            const core = document.createElement('div');
            core.className = 'cycle-core';
            core.innerHTML =
              '<b>CONTINUOUS<br>INTELLIGENCE</b><span>수집 → 분석 → 검토 → 공개<br>독립 작업이 함께 이어지는 순환</span>';
            const areas = ['1 / 2', '1 / 3', '2 / 3', '3 / 3', '3 / 2', '3 / 1', '2 / 1', '1 / 1'];
            const note = document.createElement('div');
            note.className = 'cycle-note';
            note.setAttribute('aria-live', 'polite');
            function select(index) {
              cycleSelection = index;
              board
                .querySelectorAll('.cycle-step')
                .forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
              note.replaceChildren();
              const title = document.createElement('strong');
              title.textContent = String(index + 1).padStart(2, '0') + ' · ' + cycleSteps[index][0];
              note.append(title, document.createTextNode(cycleSteps[index][4]));
            }
            cycleSteps.forEach(([title, description, timing, color], index) => {
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'cycle-step';
              button.style.gridArea = areas[index];
              button.style.setProperty('--tone', `var(--viz-series-${color})`);
              for (const [tag, cls, text] of [
                ['span', 'cycle-number', 'STEP ' + String(index + 1).padStart(2, '0')],
                ['strong', '', title],
                ['small', '', description],
                ['span', 'cycle-time', timing],
              ]) {
                const label = document.createElement(tag);
                label.className = cls;
                label.textContent = text;
                button.append(label);
              }
              button.addEventListener('click', () => select(index));
              board.append(button);
            });
            board.append(core);
            figure.replaceChildren(board, note);
            select(cycleSelection);
            const svg = element('svg', { class: 'cycle-wires', 'aria-hidden': 'true' });
            board.prepend(svg);
            const defs = element('defs');
            const marker = element('marker', {
              id: 'cycle-arrow',
              markerWidth: 8,
              markerHeight: 8,
              refX: 7,
              refY: 4,
              orient: 'auto',
            });
            marker.append(element('path', { d: 'M0 0 L8 4 L0 8 Z', fill: 'var(--viz-series-3)' }));
            defs.append(marker);
            svg.append(defs);
            const bounds = board.getBoundingClientRect();
            const cards = [...board.querySelectorAll('.cycle-step')].map((e) =>
              e.getBoundingClientRect()
            );
            const mobile = innerWidth <= 760;
            cards.forEach((a, i) => {
              const b = cards[(i + 1) % cards.length];
              if (mobile && i === cards.length - 1) return;
              const dx = b.left + b.width / 2 - (a.left + a.width / 2),
                dy = b.top + b.height / 2 - (a.top + a.height / 2);
              const scaleA = Math.min(
                dx ? (a.width / 2 + 6) / Math.abs(dx) : Infinity,
                dy ? (a.height / 2 + 6) / Math.abs(dy) : Infinity
              );
              const scaleB = Math.min(
                dx ? (b.width / 2 + 8) / Math.abs(dx) : Infinity,
                dy ? (b.height / 2 + 8) / Math.abs(dy) : Infinity
              );
              svg.append(
                element('path', {
                  d: `M${a.left + a.width / 2 - bounds.left + dx * scaleA} ${a.top + a.height / 2 - bounds.top + dy * scaleA} L${b.left + b.width / 2 - bounds.left - dx * scaleB} ${b.top + b.height / 2 - bounds.top - dy * scaleB}`,
                  fill: 'none',
                  stroke: 'var(--viz-series-3)',
                  'stroke-width': 1.7,
                  'marker-end': 'url(#cycle-arrow)',
                })
              );
            });
            detail.textContent =
              '08 → 01 반복 · 운영 구조 설명이며 실시간 실행 상태가 아닙니다. 컴퓨터·로그인 세션·서비스가 실행 중일 때 동작합니다. 사용자 중지와 제공자 대기는 별도로 유지합니다.';
          }

          function draw() {
            root
              .querySelectorAll('[data-view]')
              .forEach((button) =>
                button.setAttribute('aria-pressed', String(button.dataset.view === selected))
              );
            if (selected === 'cycle') {
              drawCycle();
              return;
            }
            const model = views[selected];
            const width = Math.max(280, figure.clientWidth);
            const compact = width < 820;
            const rows = compact
              ? model.rows.flatMap((row) => row.map((node) => [node]))
              : model.rows;
            const step = 132,
              nodeHeight = 96,
              top = 10;
            const positions = new Map();
            rows.forEach((row, index) => {
              const gap = 14;
              const cellWidth = (width - gap * (row.length - 1)) / row.length;
              row.forEach((node, column) =>
                positions.set(node[0], {
                  node,
                  x: column * (cellWidth + gap) + 18,
                  y: top + index * step,
                  width: cellWidth - 36,
                  height: nodeHeight,
                })
              );
            });
            const height = top + (rows.length - 1) * step + nodeHeight + 5;
            const svg = element('svg', {
              class: 'architecture-diagram',
              viewBox: `0 0 ${width} ${height}`,
              width,
              height,
              role: 'img',
              'aria-label': model.title,
            });
            figure.replaceChildren(svg);
            svg.append(element('title', {}, model.title));
            svg.append(
              element(
                'desc',
                {},
                model.rows.map((row) => row.map((n) => n[1] + ' — ' + n[2]).join(' / ')).join(' → ')
              )
            );
            const defs = element('defs');
            const marker = element('marker', {
              id: 'news-architecture-arrow',
              markerWidth: 7,
              markerHeight: 7,
              refX: 6,
              refY: 3.5,
              orient: 'auto',
              markerUnits: 'userSpaceOnUse',
            });
            marker.append(element('path', { d: 'M0 0 L7 3.5 L0 7 Z', fill: 'var(--border)' }));
            defs.append(marker);
            svg.append(defs);
            for (const [from, to] of model.edges) {
              const a = positions.get(from),
                b = positions.get(to);
              const ax = a.x + a.width / 2,
                ay = a.y + a.height,
                bx = b.x + b.width / 2,
                by = b.y;
              const middle = (ay + by) / 2;
              const rail = compact ? 5 : 1;
              const path =
                by - ay > step
                  ? `M${ax} ${ay + 2} L${ax} ${ay + 9} L${rail} ${ay + 9} L${rail} ${by - 12} L${bx} ${by - 12} L${bx} ${by - 4}`
                  : `M${ax} ${ay + 2} C${ax} ${middle} ${bx} ${middle} ${bx} ${by - 4}`;
              svg.append(
                element('path', {
                  class: 'connector',
                  d: path,
                  'marker-end': 'url(#news-architecture-arrow)',
                })
              );
            }
            for (const { node, x, y, width: w, height: h } of positions.values()) {
              const group = element('g', { 'aria-label': node[1] + ' · ' + node[2] });
              group.append(
                element('rect', {
                  class: 'flow-node',
                  x,
                  y,
                  width: w,
                  height: h,
                  rx: 7,
                  fill: `color-mix(in srgb, var(--viz-series-${node[3]}) 10%, var(--background))`,
                })
              );
              group.append(
                element('rect', {
                  x: x + 1,
                  y: y + 14,
                  width: 3,
                  height: h - 28,
                  rx: 1,
                  fill: `var(--viz-series-${node[3]})`,
                })
              );
              const lines = (text, maxWidth) => {
                const probe = element('text', {}, text);
                svg.append(probe);
                const result = [];
                let line = '';
                for (const letter of text) {
                  probe.textContent = line + letter;
                  if (line && probe.getComputedTextLength() > maxWidth) {
                    result.push(line.trim());
                    line = letter;
                  } else line += letter;
                }
                if (line.trim()) result.push(line.trim());
                probe.remove();
                return result;
              };
              const titleLines = lines(node[1], w - 24);
              const subtitleLines = lines(node[2], w - 24);
              const totalHeight = (titleLines.length + subtitleLines.length) * 17 + 5;
              let baseline = y + (h - totalHeight) / 2 + 13;
              for (const line of titleLines) {
                group.append(
                  element(
                    'text',
                    { class: 'node-title', x: x + w / 2, y: baseline, 'text-anchor': 'middle' },
                    line
                  )
                );
                baseline += 17;
              }
              baseline += 5;
              for (const line of subtitleLines) {
                group.append(
                  element('text', { x: x + w / 2, y: baseline, 'text-anchor': 'middle' }, line)
                );
                baseline += 17;
              }
              svg.append(group);
            }
            detail.textContent = model.detail;
            root
              .querySelectorAll('[data-view]')
              .forEach((button) =>
                button.setAttribute('aria-pressed', String(button.dataset.view === selected))
              );
          }
          function restore(state) {
            const value = state?.privateContent?.view;
            if (views[value]) selected = value;
            draw();
          }
          root.querySelectorAll('[data-view]').forEach((button) =>
            button.addEventListener('click', () => {
              selected = button.dataset.view;
              draw();
              window.openai
                ?.setWidgetState?.({
                  modelContent: { architectureView: selected },
                  privateContent: { view: selected },
                })
                ?.catch(() => {});
            })
          );
          window.addEventListener('openai:set_globals', (event) =>
            restore(event.detail?.globals?.widgetState)
          );
          new ResizeObserver(draw).observe(figure);
          restore(window.openai?.widgetState);
        })();
      </script>
    </main>
  </body>
</html>
