<!doctype html>
<html lang="ko">
  <head>
    <link rel="stylesheet" href="/workspace.css" />
    <script src="/workspace.js" defer></script>
    <script src="/workspace-navigation.js" defer></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>종합 전략 분석 · 텔레그램 데일리</title>
    <style>
      :root {
        --navy: #0b1f3a;
        --blue: #1769e0;
        --blue-soft: #eaf2ff;
        --ink: #172033;
        --muted: #657087;
        --line: #dce3ed;
        --paper: #fff;
        --canvas: #f5f7fa;
        --violet: #6e4bc4;
        --teal: #087f75;
        --amber: #9a5b00;
        --red: #a12a2a;
        --green: #14715e;
        --shadow: 0 12px 34px rgba(11, 31, 58, 0.09);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        background: var(--canvas);
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: var(--canvas);
        font-family:
          Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      a {
        color: inherit;
      }
      :where(button, input, select, a, [tabindex]):focus-visible {
        outline: 3px solid #73a8f4;
        outline-offset: 3px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 26px;
        min-height: 72px;
        padding: 14px clamp(18px, 4vw, 60px);
        color: #fff;
        background: var(--navy);
      }
      .brand {
        text-decoration: none;
        white-space: nowrap;
      }
      .brand strong {
        display: block;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .brand span {
        display: block;
        margin-top: 2px;
        color: #aebbd0;
        font-size: 11px;
      }
      .nav {
        display: flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
      }
      .nav a {
        min-height: 34px;
        padding: 8px 12px;
        border-radius: 7px;
        color: #c8d3e4;
        font-size: 12px;
        font-weight: 750;
        text-decoration: none;
        white-space: nowrap;
      }
      .nav a:hover {
        color: #fff;
      }
      .nav a.active {
        color: var(--navy);
        background: #fff;
      }
      .page {
        width: min(1480px, 100%);
        margin: 0 auto;
        padding: 34px clamp(16px, 3vw, 48px) 70px;
      }
      .intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
        padding-bottom: 24px;
        border-bottom: 2px solid var(--navy);
      }
      .intro h1 {
        margin: 0;
        color: var(--navy);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(36px, 5vw, 58px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.048em;
      }
      .intro p {
        max-width: 720px;
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      .start {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 9px;
        color: #fff;
        background: var(--blue);
        font-size: 13px;
        font-weight: 800;
      }
      .start:hover:not(:disabled) {
        background: #105bc5;
      }
      .start:disabled {
        cursor: default;
        opacity: 0.48;
      }
      .snapshot-note {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 17px 0 0;
        padding: 12px 14px;
        border-left: 3px solid #8aa9d5;
        color: #465269;
        background: #edf3fb;
        font-size: 12px;
        line-height: 1.6;
      }
      .snapshot-note strong {
        color: var(--navy);
      }
      .layout {
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr);
        gap: 34px;
        margin-top: 28px;
      }
      .rail {
        align-self: start;
        position: sticky;
        top: 100px;
      }
      .rail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .rail-head h2 {
        margin: 0;
        color: var(--navy);
        font-size: 16px;
      }
      .refresh {
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--navy);
        background: #fff;
        font-size: 11px;
        font-weight: 750;
      }
      .runs {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .run-button {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: #465269;
        background: #fff;
        text-align: left;
      }
      .run-button:hover {
        border-color: #9dbce7;
      }
      .run-button.active {
        border-color: var(--navy);
        color: #fff;
        background: var(--navy);
        box-shadow: 0 7px 18px rgba(11, 31, 58, 0.16);
      }
      .run-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .run-date {
        font-size: 12px;
        font-weight: 800;
      }
      .run-id {
        display: block;
        margin-top: 6px;
        font-size: 10px;
        opacity: 0.72;
        overflow-wrap: anywhere;
      }
      .run-progress {
        height: 3px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 4px;
        background: #e1e6ee;
      }
      .run-progress i {
        display: block;
        height: 100%;
        background: var(--blue);
      }
      .run-button.active .run-progress {
        background: rgba(255, 255, 255, 0.18);
      }
      .run-button.active .run-progress i {
        background: #7cb1ff;
      }
      .rail-empty {
        padding: 18px 12px;
        border: 1px dashed #c6d0df;
        border-radius: 9px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        text-align: center;
      }
      .content {
        min-width: 0;
      }
      .status {
        padding: 70px 24px;
        color: var(--muted);
        text-align: center;
      }
      .spinner {
        width: 26px;
        height: 26px;
        margin: 0 auto 14px;
        border: 3px solid #dce6f5;
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .error {
        color: var(--red);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .run-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }
      .run-head h2 {
        margin: 4px 0 6px;
        color: var(--navy);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.035em;
      }
      .run-meta {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 99px;
        color: #536077;
        background: #edf1f6;
        font-size: 10px;
        font-weight: 800;
      }
      .status-pill.running,
      .status-pill.queued {
        color: var(--amber);
        background: #fff2d7;
      }
      .status-pill.complete {
        color: var(--green);
        background: #e4f5ef;
      }
      .status-pill.complete_with_failures,
      .status-pill.paused {
        color: #7a4a00;
        background: #fff0cb;
      }
      .status-pill.failed {
        color: var(--red);
        background: #fbeaea;
      }
      .resume {
        margin-top: 10px;
        padding: 8px 12px;
        border: 1px solid var(--blue);
        border-radius: 8px;
        color: var(--blue);
        background: #fff;
        font-size: 11px;
        font-weight: 800;
      }
      .resume:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .progress-card {
        margin-top: 18px;
        padding: 18px;
        border: 1px solid var(--line);
        background: #fff;
        box-shadow: var(--shadow);
      }
      .progress-top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
      }
      .progress-top strong {
        color: var(--navy);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 32px;
        font-weight: 500;
      }
      .progress-top span {
        color: var(--muted);
        font-size: 11px;
      }
      .progress-track {
        height: 9px;
        margin: 12px 0 15px;
        overflow: hidden;
        border-radius: 9px;
        background: #e8edf4;
      }
      .progress-track i {
        display: block;
        height: 100%;
        background: var(--blue);
        transition: width 0.35s ease;
      }
      .coverage-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
      }
      .coverage-cell {
        padding: 12px;
        background: #fff;
      }
      .coverage-cell span {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }
      .coverage-cell strong {
        display: block;
        margin-top: 4px;
        color: var(--navy);
        font-size: 18px;
      }
      .coverage-cell.failed strong {
        color: var(--red);
      }
      .coverage-note {
        margin: 13px 0 0;
        color: #5a4a25;
        font-size: 11px;
        line-height: 1.55;
      }
      .coverage-note.ok {
        color: var(--green);
      }
      .section {
        margin-top: 34px;
      }
      .section-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 13px;
        padding-bottom: 9px;
        border-bottom: 2px solid var(--navy);
      }
      .section-head h2 {
        margin: 0;
        color: var(--navy);
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 25px;
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      .section-head p {
        max-width: 580px;
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.55;
        text-align: right;
      }
      .empty-block {
        padding: 28px;
        border: 1px dashed #c7d0dd;
        color: var(--muted);
        background: #fafbfc;
        font-size: 12px;
        line-height: 1.6;
        text-align: center;
      }
      .metric-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }
      .panel {
        min-width: 0;
        padding: 18px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .panel.daily-topics {
        grid-column: 1/-1;
      }
      .panel h3 {
        margin: 0 0 14px;
        color: var(--navy);
        font-size: 15px;
      }
      .bar-list {
        display: grid;
        gap: 11px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .bar-label {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 5px;
        color: #465269;
        font-size: 11px;
      }
      .bar-label strong {
        color: var(--navy);
      }
      .bar {
        height: 7px;
        overflow: hidden;
        border-radius: 7px;
        background: #edf1f6;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--blue);
      }
      .day-bars .bar i {
        background: var(--teal);
      }
      .player-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
      }
      .player-tabs button {
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 99px;
        color: #536077;
        background: #fff;
        font-size: 10px;
        font-weight: 800;
      }
      .player-tabs button.active {
        border-color: var(--blue);
        color: #fff;
        background: var(--blue);
      }
      .players {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .player {
        padding: 12px;
        border-left: 3px solid #9cb9e2;
        background: #fff;
      }
      .player[data-type='country'] {
        border-color: var(--blue);
      }
      .player[data-type='company'] {
        border-color: var(--violet);
      }
      .player[data-type='person'] {
        border-color: var(--teal);
      }
      .player[data-type='institution'] {
        border-color: #d09732;
      }
      .player strong {
        display: block;
        color: var(--navy);
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .player span {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 10px;
      }
      .attention-note {
        margin: 11px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.5;
      }
      .report-summary {
        margin: 0;
        padding: 20px;
        border-left: 4px solid var(--blue);
        color: #344054;
        background: #eef4fc;
        font-size: 14px;
        line-height: 1.8;
        white-space: pre-wrap;
      }
      .topic-cards,
      .strategy-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .topic-card,
      .strategy-card,
      .relation-row {
        padding: 16px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .topic-card h3,
      .strategy-card h3 {
        margin: 0;
        color: var(--navy);
        font-size: 15px;
      }
      .topic-card p,
      .strategy-card p {
        margin: 8px 0 0;
        color: #465269;
        font-size: 12px;
        line-height: 1.65;
        white-space: pre-wrap;
      }
      .weight {
        float: right;
        color: var(--blue);
        font-size: 11px;
      }
      .evidence-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .evidence-link {
        padding: 4px 7px;
        border: 0;
        border-radius: 5px;
        color: #1459b7;
        background: var(--blue-soft);
        font-size: 9px;
        font-weight: 800;
        text-decoration: none;
      }
      .evidence-link:hover {
        text-decoration: underline;
      }
      .relations {
        display: grid;
        gap: 7px;
      }
      .relation-row {
        display: grid;
        grid-template-columns: minmax(100px, 0.7fr) 28px minmax(100px, 0.7fr) minmax(150px, 1.4fr);
        gap: 10px;
        align-items: center;
      }
      .relation-entity {
        color: var(--navy);
        font-size: 12px;
        font-weight: 800;
        overflow-wrap: anywhere;
      }
      .arrow {
        color: var(--blue);
        text-align: center;
      }
      .relation-meaning {
        color: #465269;
        font-size: 11px;
        line-height: 1.55;
      }
      .relation-type {
        display: block;
        margin-bottom: 3px;
        color: var(--violet);
        font-size: 9px;
        font-weight: 800;
      }
      .horizons {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .horizon {
        border-top: 4px solid var(--blue);
        background: #fff;
        box-shadow:
          0 1px 0 var(--line),
          inset 1px 0 var(--line),
          inset -1px 0 var(--line);
      }
      .horizon.medium {
        border-color: var(--violet);
      }
      .horizon.long {
        border-color: var(--teal);
      }
      .horizon-head {
        padding: 14px 15px;
        border-bottom: 1px solid var(--line);
      }
      .horizon-head strong {
        display: block;
        color: var(--navy);
        font-size: 15px;
      }
      .horizon-head span {
        color: var(--muted);
        font-size: 10px;
      }
      .scenario {
        padding: 15px;
        border-bottom: 1px solid var(--line);
      }
      .scenario:last-child {
        border-bottom: 0;
      }
      .scenario h3 {
        margin: 0 0 7px;
        color: var(--navy);
        font-size: 13px;
        line-height: 1.45;
      }
      .scenario p {
        margin: 0;
        color: #465269;
        font-size: 11px;
        line-height: 1.62;
        white-space: pre-wrap;
      }
      .scenario dl {
        display: grid;
        gap: 7px;
        margin: 11px 0 0;
      }
      .scenario dt {
        color: var(--muted);
        font-size: 9px;
        font-weight: 800;
      }
      .scenario dd {
        margin: 2px 0 0;
        color: #465269;
        font-size: 10px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .docs-tools {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .docs-page {
        color: var(--muted);
        font-size: 11px;
      }
      .docs-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .doc {
        padding: 16px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .doc:target,
      .doc.highlight {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.12);
      }
      .doc-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      .doc-title {
        margin: 0;
        color: var(--navy);
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .doc-id {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 9px;
        overflow-wrap: anywhere;
      }
      .doc-badges {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 5px;
      }
      .doc-badge {
        padding: 4px 7px;
        border-radius: 99px;
        color: #536077;
        background: #edf1f6;
        font-size: 9px;
        font-weight: 800;
        white-space: nowrap;
      }
      .doc-badge.full,
      .doc-badge.complete {
        color: var(--green);
        background: #e4f5ef;
      }
      .doc-badge.excerpt,
      .doc-badge.running {
        color: var(--amber);
        background: #fff2d7;
      }
      .doc-badge.failed {
        color: var(--red);
        background: #fbeaea;
      }
      .doc-summary {
        margin: 12px 0 0;
        color: #465269;
        font-size: 12px;
        line-height: 1.7;
        white-space: pre-wrap;
      }
      .doc-detail {
        margin-top: 10px;
      }
      .doc-detail summary {
        color: var(--blue);
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
      }
      .doc-fields {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .doc-field strong {
        display: block;
        color: var(--muted);
        font-size: 9px;
      }
      .doc-field p {
        margin: 3px 0 0;
        color: #465269;
        font-size: 11px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .doc-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 11px;
      }
      .doc-links a {
        color: var(--blue);
        font-size: 10px;
        font-weight: 800;
        text-decoration: none;
      }
      .doc-links a:hover {
        text-decoration: underline;
      }
      .pager {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 14px;
      }
      .pager button {
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--navy);
        background: #fff;
        font-size: 10px;
        font-weight: 800;
      }
      .pager button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      @media (max-width: 1050px) {
        .layout {
          grid-template-columns: 220px minmax(0, 1fr);
        }
        .players {
          grid-template-columns: repeat(2, 1fr);
        }
        .horizons {
          grid-template-columns: 1fr;
        }
        .horizon {
          border-left: 4px solid var(--blue);
          border-top: 1px solid var(--line);
        }
        .horizon.medium {
          border-left-color: var(--violet);
        }
        .horizon.long {
          border-left-color: var(--teal);
        }
      }
      @media (max-width: 760px) {
        .topbar {
          display: block;
          padding: 16px;
        }
        .nav {
          width: max-content;
          max-width: 100%;
          margin-top: 13px;
          overflow-x: auto;
        }
        .page {
          padding: 24px 12px 50px;
        }
        .intro {
          display: block;
        }
        .start {
          width: 100%;
          margin-top: 18px;
        }
        .layout {
          display: block;
        }
        .rail {
          position: static;
          margin-bottom: 25px;
        }
        .runs {
          display: flex;
          overflow-x: auto;
        }
        .runs li {
          flex: 0 0 210px;
        }
        .metric-grid,
        .topic-cards,
        .strategy-grid {
          grid-template-columns: 1fr;
        }
        .coverage-grid {
          grid-template-columns: 1fr 1fr;
        }
        .players {
          grid-template-columns: 1fr 1fr;
        }
        .relation-row {
          grid-template-columns: 1fr 22px 1fr;
        }
        .relation-meaning {
          grid-column: 1/-1;
          padding-top: 8px;
          border-top: 1px solid var(--line);
        }
        .section-head {
          display: block;
        }
        .section-head p {
          margin-top: 6px;
          text-align: left;
        }
        .doc-head {
          display: block;
        }
        .doc-badges {
          justify-content: flex-start;
          margin-top: 9px;
        }
      }
      @media (max-width: 440px) {
        .players {
          grid-template-columns: 1fr;
        }
        .coverage-grid {
          grid-template-columns: 1fr 1fr;
        }
        .progress-top {
          display: block;
        }
        .progress-top span {
          display: block;
          margin-top: 5px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .progress-track i {
          transition: none;
        }
      }
    </style>
    <link rel="stylesheet" href="/workspace-ui.css" />
  </head>
  <body>
    <a class="workspace-skip" href="#main">본문으로 이동</a>

    <main id="main" class="page">
      <header class="intro">
        <div>
          <h1>종합 전략 분석</h1>
          <p>
            수집한 뉴스와 원문을 하나의 시점으로 묶어 주제 비중, 주요 플레이어의 관계, 국가·기업
            전략 흐름과 조건부 전망을 분석합니다.
          </p>
        </div>
        <button class="start" id="start" type="button" disabled>수집 완료 · 종합 분석</button>
      </header>
      <div class="snapshot-note">
        <span aria-hidden="true">◫</span
        ><span
          ><strong>분석 범위는 시작 시점에 고정됩니다.</strong> 같은 메시지와 정규화된 동일 URL은 한
          문서로 묶어 중복을 제외합니다. 실행 중 새로 수집되는 메시지와 URL은 현재 결과에 섞이지
          않으며, 다음 분석 스냅샷에 포함됩니다.</span
        >
      </div>
      <div class="layout">
        <aside class="rail" aria-label="분석 스냅샷">
          <div class="rail-head">
            <h2>분석 기록</h2>
            <button class="refresh" id="refresh" type="button">새로고침</button>
          </div>
          <ol class="runs" id="runs"></ol>
        </aside>
        <div class="content" id="content">
          <div class="status">
            <div class="spinner"></div>
            분석 기록을 불러오는 중입니다.
          </div>
        </div>
      </div>
    </main>
    <script src="/research.js" defer></script>
  </body>
</html>
