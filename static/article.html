<!doctype html>
<html lang="ko">
  <head>
    <link rel="stylesheet" href="/workspace.css" />
    <script src="/workspace.js" defer></script>
    <script src="/workspace-navigation.js" defer></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>기사 상세 해설</title>
    <link rel="stylesheet" href="/sources.css" />
    <style>
      main {
        max-width: 1000px;
        margin: auto;
        padding: 24px;
      }
      section,
      .observation-details {
        margin: 24px 0;
        padding: 20px;
        border: 1px solid #ccd8d0;
        border-radius: 14px;
      }
      p {
        line-height: 1.8;
        overflow-wrap: anywhere;
      }
      blockquote {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 16px 0;
        padding: 12px;
        background: #f2f6f3;
      }
      svg {
        width: 100%;
        height: 300px;
      }
      a {
        overflow-wrap: anywhere;
      }
      .kind {
        font-size: 12px;
        color: #526759;
      }
      button {
        padding: 10px 16px;
      }
      #status {
        white-space: pre-wrap;
      }
      table {
        width: 100%;
        text-align: left;
      }
      td,
      th {
        padding: 8px;
        overflow-wrap: anywhere;
      }
      table {
        table-layout: fixed;
        font-size: 13px;
      }
    </style>
    <link rel="stylesheet" href="/workspace-ui.css" />
  </head>
  <body>
    <a class="workspace-skip" href="#main">본문으로 이동</a>
    <main id="main">
      <h1>기사 상세 해설</h1>
      <p>무엇이 달라졌고, 누구에게 어떤 의미가 있는지 원문에 근거해 설명합니다.</p>
      <a id="source" rel="noopener noreferrer" target="_blank">원문 보기</a>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="generate">상세 해설 생성</button>
      <div id="result"></div>
    </main>
    <script src="/article.js" defer></script>
  </body>
</html>
